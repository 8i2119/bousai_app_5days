{% extends "base.html" %}

{% block content %}
<header class="page-heading">
  <p class="eyebrow">SHELTER DIRECTORY</p>
  <h1>避難所登録</h1>
  <p>新しい避難所情報を登録します。</p>
</header>

{% if error %}
  <p class="notice notice-error" role="alert">{{ message }}</p>
{% endif %}

<section class="panel form-panel">
  <form method="POST" class="form-stack">
    <div class="form-field">
      <label for="name">避難所名 <span class="required-mark">必須</span></label>
      <input type="text" id="name" name="name" autocomplete="organization" required>
    </div>
    <div class="form-actions">
      <button class="button button-primary" type="submit">登録する</button>
    </div>
  </form>
</section>
{% endblock %}
