{% extends "base.html" %}

{% block content %}
<section class="panel map-panel" aria-labelledby="map-title">
    <div class="panel-heading">
        <h1 id="map-title"><span class="heading-symbol" aria-hidden="true">⌖</span> 避難所マップ</h1>
    </div>
    <div id="shelterMap" class="shelter-map" aria-label="避難所周辺の地図"></div>
</section>

<section class="panel weather-panel" aria-labelledby="weather-title">
    <div class="panel-heading panel-heading-spread">
        <h2 id="weather-title"><span class="heading-symbol" aria-hidden="true">☼</span> 青森市 気象警報・注意報</h2>
        <span class="refresh-label"><span aria-hidden="true">↻</span> 10分おき自動更新</span>
    </div>
    <div id="weatherContent" class="weather-content" aria-live="polite" aria-atomic="true">
        <p class="loading-message">気象情報を読み込み中...</p>
    </div>
</section>

<!-- Leaflet の読み込み -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 地図の初期化（青森市周辺を中心に設定）
    const map = L.map('shelterMap').setView([40.8246, 140.7400], 12);

    // OpenStreetMapタイルを追加
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    // 気象警報・注意報の自動更新機能
    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<p class="notice notice-error">気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul class="warning-list">';
            data.warnings.forEach(warning => {
                warningsHtml += `<li><strong>${warning.name}</strong><span>${warning.status}</span></li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = '<p class="weather-clear"><span class="status-check" aria-hidden="true">✓</span>現在、警報・注意報は発表されていません</p>';
        }

        weatherContent.innerHTML = `
            <p class="weather-area"><span class="meta-symbol" aria-hidden="true">⌖</span>${data.area_name || '青森市'}</p>
            ${warningsHtml}
            <p class="weather-meta"><span class="meta-symbol" aria-hidden="true">◷</span>データ取得: <span id="lastFetchTime">${data.last_fetch_time || '更新中...'}</span></p>
            <p class="weather-meta"><span class="meta-symbol" aria-hidden="true">↗</span>気象庁発表: ${data.report_time || '不明'}</p>
        `;
    }

    // 初回表示＋10分（600,000ミリ秒）おきに自動更新
    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
